<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль чата — Админ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <header class="bg-gray-800 p-4 border-b border-gray-700">
        <div class="max-w-2xl mx-auto flex justify-between">
            <a href="/admin" class="text-indigo-400">← Назад</a>
            <h1 class="font-bold">📝 Профиль чата</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 py-8">

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-4 rounded {{ 'bg-green-600' if category == 'success' else 'bg-red-600' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="bg-gray-800 rounded-xl p-6 space-y-5">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Название чата</label>
                <input type="text" name="chat_name" value="{{ chat_name }}" required
                    class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">Описание</label>
                <textarea name="chat_description" rows="3"
                    class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500">{{ chat_description }}</textarea>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">Аватар (URL)</label>
                <input type="url" name="chat_avatar" value="{{ chat_avatar or '' }}" placeholder="https://..."
                    class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="bg-gray-700 rounded-lg p-4 flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                    {% if chat_avatar %}
                        <img src="{{ chat_avatar }}" class="w-full h-full rounded-full object-cover">
                    {% else %}
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/>
                        </svg>
                    {% endif %}
                </div>
                <div>
                    <p class="font-semibold">{{ chat_name }}</p>
                    <p class="text-sm text-gray-400">{{ chat_description }}</p>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-semibold">
                Сохранить
            </button>
        </form>
    </main>
</body>
</html>
