<!DOCTYPE html>
{% from 'macros.html' import flash_messages %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сообщения - Админ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_messages.css') }}">
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <header class="bg-gray-800 p-4 border-b border-gray-700">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="/admin" class="text-indigo-400 hover:text-indigo-300 transition">← Назад</a>
            <h1 class="font-bold">Сообщения</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 py-8">

        {{ flash_messages() }}

        <div class="bg-gray-800 rounded-xl messages-list">
            {% for msg in messages %}
            <div class="p-4 border-b border-gray-700 flex justify-between items-start hover:bg-gray-700 transition message-item"
                 data-message-id="{{ msg.id }}"
                 data-user-id="{{ msg.user.id }}"
                 data-timestamp="{{ msg.timestamp.isoformat() }}">

                <div class="message-content-wrapper flex-1 min-w-0 pr-4">
                    <div class="flex items-center gap-2 mb-1 message-meta">
                        <a href="/profile/{{ msg.user.id }}" class="font-semibold text-indigo-400 hover:text-indigo-300 username-link">
                            {{ msg.user.username }}
                        </a>
                        <span class="text-xs text-gray-500 message-time" title="{{ msg.timestamp }}">
                            {{ msg.timestamp.strftime('%d.%m %H:%M') }}
                        </span>
                    </div>
                    <p class="text-gray-300 message-text break-words">{{ msg.content }}</p>
                </div>

                <form method="POST" action="/admin/message/{{ msg.id }}/delete" class="delete-form flex-shrink-0">
                    <button type="submit" class="p-2 bg-red-600 hover:bg-red-700 rounded text-white delete-btn transition"
                            title="Удалить сообщение"
                            onclick="return confirm('Удалить это сообщение?')">
                        Удалить
                    </button>
                </form>
            </div>
            {% else %}
            <div class="p-8 text-center text-gray-500 empty-state">
                <p>Нет сообщений для отображения</p>
            </div>
            {% endfor %}
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/admin_messages.js') }}"></script>
</body>
</html>
