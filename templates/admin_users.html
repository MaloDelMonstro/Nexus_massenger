<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи — Админ-панель</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <header class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <a href="/admin" class="text-indigo-400 hover:text-indigo-300">← Назад</a>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4 py-8">

        <h1 class="text-2xl font-bold mb-6">👥 Пользователи</h1>

        <div class="bg-gray-800 rounded-lg overflow-hidden">
            <div class="p-4 border-b border-gray-700 bg-gray-750">
                <h2 class="font-semibold text-lg">Пользователь</h2>
            </div>

            <div class="divide-y divide-gray-700">
                {% for user in users %}
                <a href="/admin/user/{{ user.id }}" class="block hover:bg-gray-700/50 transition">
                    <div class="p-4 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold flex-shrink-0">
                            {% if user.avatar_url %}
                                <img src="{{ user.avatar_url }}" alt="{{ user.username }}" class="w-full h-full rounded-full object-cover">
                            {% else %}
                                {{ user.username[0].upper() }}
                            {% endif %}
                        </div>

                        <div class="flex-1 min-w-0">
                            <p class="font-semibold truncate">{{ user.username }}</p>
                        </div>

                        <div class="flex gap-2 flex-shrink-0">
                            {% if user.is_admin %}
                            <span class="px-2 py-1 bg-blue-600/30 text-blue-400 rounded text-xs">Админ</span>
                            {% endif %}
                            {% if user.is_banned %}
                            <span class="px-2 py-1 bg-red-600/30 text-red-400 rounded text-xs">Бан</span>
                            {% endif %}
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>

    </div>

</body>
</html>
