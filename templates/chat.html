<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">

    <!-- Шапка -->
    <div class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold">
                {{ current_user.username[0].upper() }}
            </div>
            <div>
                <h1 class="font-bold">Общий чат</h1>
                <p class="text-xs text-green-400">● Онлайн</p>
            </div>
        </div>
        <a href="/logout" class="text-sm text-gray-400 hover:text-white">Выйти</a>
    </div>

    <!-- Область сообщений -->
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll">
        {% for msg in messages %}
            <div class="flex flex-col {{ 'items-end' if msg.user_id == current_user.id else 'items-start' }}">
                <div class="max-w-[80%] p-3 rounded-lg {{ 'bg-indigo-600' if msg.user_id == current_user.id else 'bg-gray-700' }}">
                    <p class="text-sm">{{ msg.content }}</p>
                </div>
                <span class="text-xs text-gray-500 mt-1 px-1">
                    {{ msg.user.username }} • {{ msg.timestamp.strftime('%H:%M') }}
                </span>
            </div>
        {% endfor %}
    </div>

    <!-- Ввод сообщения -->
    <div class="bg-gray-800 p-4">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="message-input" autocomplete="off"
                class="flex-1 bg-gray-700 text-white rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder="Напишите сообщение...">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full w-12 h-12 flex items-center justify-center transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </form>
    </div>

    <script>
        const socket = io();
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const container = document.getElementById('messages-container');

        // Прокрутка вниз при загрузке
        container.scrollTop = container.scrollHeight;

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = input.value;
            if (message) {
                socket.emit('send_message', { message: message });
                input.value = '';
            }
        });

        socket.on('receive_message', (data) => {
            const isMine = data.username === "{{ current_user.username }}";

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'} message-enter`;

            msgDiv.innerHTML = `
                <div class="max-w-[80%] p-3 rounded-lg ${isMine ? 'bg-indigo-600' : 'bg-gray-700'}">
                    <p class="text-sm">${data.message}</p>
                </div>
                <span class="text-xs text-gray-500 mt-1 px-1">
                    ${data.username} • ${data.time}
                </span>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
