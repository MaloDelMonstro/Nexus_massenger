<!DOCTYPE html>
{% from 'macros.html' import flash_messages %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка {{ code }} — Nexus Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="text-center error-container"
         role="alert"
         aria-live="assertive"
         data-error-code="{{ code }}"
         data-error-type="{{ 'server' if code >= 500 else 'client' }}">

        <h1 class="text-6xl font-bold text-indigo-600 mb-4 error-code" aria-label="Код ошибки: {{ code }}">
            {{ code }}
        </h1>

        <p class="text-xl text-gray-400 mb-8 error-message">{{ error }}</p>

        <div class="flex gap-4 justify-center error-actions">
            <a href="/chat" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-lg transition btn-back-chat" aria-label="Вернуться в чат">
                ← В чат
            </a>
            <a href="/" class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg transition btn-home" aria-label="Перейти на главную">
                На главную
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/error.js') }}"></script>
</body>
</html>
