<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка {{ code }} — Nexus Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="text-center error-container">
        <h1 class="text-6xl font-bold text-indigo-600 mb-4 error-code">{{ code }}</h1>
        <p class="text-xl text-gray-400 mb-8 error-message">{{ error }}</p>
        <div class="flex gap-4 justify-center">
            <a href="/chat" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-3 rounded-lg transition btn-back-chat">
                ← В чат
            </a>
            <a href="/" class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg transition btn-home">
                На главную
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/error.js') }}"></script>
</body>
</html>
