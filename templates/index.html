{% extends 'base.html' %}
{% block title %}Nexus Messenger — Чат нового поколения{% endblock %}

{% block content %}
<style>header, nav, .top-bar { display: none !important; }</style>

<div class="min-h-screen bg-gray-900 text-white selection:bg-indigo-500/30">
    
    <section class="relative pt-24 pb-20 px-4 text-center overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/40 via-gray-900 to-gray-900 pointer-events-none"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto">
            
            <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">
                Nexus <span class="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">Messenger</span>
            </h1>
            
            <p class="text-xl md:text-2xl text-gray-300 max-w-2xl mx-auto mb-10 leading-relaxed">
                Общайся, используй плагины.
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="{{ url_for('auth.register') }}" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold text-lg transition shadow-lg shadow-indigo-500/30 hover:scale-105 active:scale-95">
                    Начать бесплатно
                </a>
                <a href="{{ url_for('auth.login') }}" class="px-8 py-4 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl font-bold text-lg transition hover:border-gray-500">
                    Войти в аккаунт
                </a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
