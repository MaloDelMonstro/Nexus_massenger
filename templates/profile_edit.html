<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-2xl mx-auto px-4 py-3">
            <a href="/profile" class="text-indigo-400 hover:text-indigo-300 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Назад к профилю
            </a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded-lg {{ 'bg-green-600' if category == 'success' else 'bg-red-600' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="bg-gray-800 rounded-2xl p-8 shadow-xl">
            <h1 class="text-2xl font-bold mb-6 text-center">✏️ Редактирование профиля</h1>

            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Имя пользователя</label>
                    <input type="text" name="username" value="{{ user.username }}" required minlength="2"
                        class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required
                        class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="border-t border-gray-700 pt-5">
                    <h3 class="text-sm font-semibold text-gray-300 mb-3">🔐 Смена пароля (оставьте пустым, если не меняете)</h3>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Текущий пароль</label>
                            <input type="password" name="current_password"
                                class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Новый пароль</label>
                            <input type="password" name="new_password" minlength="6"
                                class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Подтверждение пароля</label>
                            <input type="password" name="confirm_password"
                                class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-semibold transition">
                        Сохранить изменения
                    </button>
                    <a href="/profile" class="px-6 bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-semibold transition">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
