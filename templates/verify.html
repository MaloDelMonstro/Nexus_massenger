<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">Подтверждение Email</h2>
        <p class="text-gray-400 text-center mb-6 text-sm">Код отправлен на {{ email }}</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded text-sm {{ 'bg-red-500' if category == 'error' else 'bg-green-500' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="mb-4">
            <div class="mb-6">
                <label class="block text-sm mb-2 text-center">Введите 6-значный код</label>
                <input type="text" name="code" maxlength="6" required
                    class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500 text-center text-2xl tracking-widest"
                    placeholder="000000">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded transition">
                Подтвердить
            </button>
        </form>

        <form action="/resend-code" method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" class="w-full text-sm text-gray-400 hover:text-white transition">
                Отправить код повторно
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/login" class="text-sm text-indigo-400 hover:underline">Вернуться ко входу</a>
        </div>
    </div>
</body>
</html>
