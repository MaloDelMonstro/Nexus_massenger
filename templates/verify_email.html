<!DOCTYPE html>
{% from 'macros.html' import flash_messages %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/verify_email.css') }}">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md verify-container"
         role="main"
         aria-labelledby="verify-title">

        <h2 id="verify-title" class="text-2xl font-bold mb-2 text-center text-indigo-400">Подтверждение Email</h2>
        <p class="text-gray-400 text-center mb-6 text-sm verify-email-text">Код отправлен на <span class="text-white">{{ email }}</span></p>

        {{ flash_messages() }}

        <form method="POST" class="mb-4 verify-form" id="verify-form" data-form="verify" novalidate>
            <div class="mb-6 form-group">
                <label class="block text-sm mb-2 text-center" for="code">
                    Введите 6-значный код
                    <span class="text-gray-500 font-normal" aria-hidden="true">*</span>
                </label>
                <input type="text" name="code" id="code" maxlength="6" required inputmode="numeric" pattern="[0-9]{6}"
                    class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500 text-center text-2xl tracking-widest input-code"
                    placeholder="000000"
                    autocomplete="one-time-code"
                    aria-describedby="code-hint"
                    data-field="code">
                <span id="code-hint" class="text-xs text-gray-500 mt-1 block text-center">
                    Только цифры, 6 символов
                </span>
                <span class="error-message text-red-400 text-xs mt-1 hidden text-center" role="alert"></span>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded transition btn-verify focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800">
                Подтвердить
            </button>
        </form>

        <form method="POST" action="/verify_code" class="mb-4 verify-form" id="verify-form" data-form="verify" novalidate>
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" class="w-full text-sm text-gray-400 hover:text-white transition btn-resend"
                    aria-label="Отправить код подтверждения повторно">
                Отправить код повторно
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/login" class="text-sm text-indigo-400 hover:underline link-login">Вернуться ко входу</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/verify_email.js') }}"></script>
</body>
</html>
